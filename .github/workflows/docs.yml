name: Docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install .[docs]
      - name: Build (fails on any warning)
        # No CI caching: Zensical advises against it while its cache format changes.
        run: zensical build --strict --clean
      - name: Upload site
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    # Publishes once Settings → Pages → Source is set to "GitHub Actions"; until then
    # the job skips deploying and leaves a notice instead of failing every push.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check that GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          body="$RUNNER_TEMP/pages.json"
          code=$(curl -s -o "$body" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pages")
          fix='Set Settings → Pages → Source to "GitHub Actions" to publish them.'
          if [ "$code" = 200 ] && [ "$(jq -r .build_type "$body")" = workflow ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" = 200 ] || [ "$code" = 404 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Docs built but not deployed::GitHub Pages is not publishing from GitHub Actions. $fix"
          else
            echo "::error::checking GitHub Pages failed with HTTP $code"
            exit 1
          fi
      - id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v5
