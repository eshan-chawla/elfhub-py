name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install .[dev]
          python -m pip install ./tests/fixtures/plugin_pkg
      - name: Lint
        run: ruff check .
      - name: Type check
        run: pyright
      - name: Run tests
        run: python -m pytest -v

  lowest-versions:
    # Proves the declared minimum dependency versions really work.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install with the lowest allowed versions
        # --python pins the target venv: without it, uv installs into $VIRTUAL_ENV
        # whenever one is active, instead of the .venv created here.
        run: |
          uv venv --python 3.11
          uv pip install --python .venv/bin/python --resolution lowest-direct -e . "pytest>=8" "pytest-asyncio>=0.24"
          uv pip install --python .venv/bin/python ./tests/fixtures/plugin_pkg
      - name: Run tests
        run: .venv/bin/python -m pytest -q

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, lowest-versions]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
