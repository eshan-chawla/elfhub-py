[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "elfhub"
version = "0.1.0"
description = "ElfHub: a minimal agent framework base class"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Eshan Chawla" }]
keywords = ["agent", "ai", "agents", "framework"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/eshanchawla/elfhub-py"
Repository = "https://github.com/eshanchawla/elfhub-py"

[project.optional-dependencies]
dev = ["pytest", "build", "twine"]

[tool.hatch.build.targets.wheel]
packages = ["src/elfhub"]
